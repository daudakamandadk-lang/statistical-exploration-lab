[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-exploration-lab"
version = "0.2.0"
description = "Composable table inspection with explicit field roles and reusable result rendering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.urls]
Repository = "https://github.com/daudakamandadk-lang/statistical-exploration-lab"
Documentation = "https://github.com/daudakamandadk-lang/statistical-exploration-lab/blob/main/docs/README.md"
Issues = "https://github.com/daudakamandadk-lang/statistical-exploration-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]
