[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-exploration-lab"
version = "0.1.0"
description = "An understandable local lab for distributions and selected statistical relationships."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.24,<3",
]

[project.scripts]
statistical-lab = "statistical_exploration_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
