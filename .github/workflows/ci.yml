name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install lab package
        run: python -m pip install -e ".[econometrics]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check components and retained rendering
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run table inspection example
        run: python -B examples/inspect_table.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Run library-backed investigation example
        env:
          MPLBACKEND: Agg
        run: python -B examples/investigate_relationship.py
